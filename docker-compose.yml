version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: archai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - archai_net

  postgres:
    image: postgres:16-alpine
    container_name: archai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archai}
      POSTGRES_USER: ${POSTGRES_USER:-archai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archai_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - archai_net

  neo4j:
    image: neo4j:5-enterprise
    container_name: archai-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-archai-graph}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - archai_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: archai-backend
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://archai:archai_password@postgres:5432/archai}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-archai-graph}
      QUARANTINE_DIR: /app/quarantine
      REPORTS_DIR: /app/reports
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - archai_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: archai-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - archai_net

volumes:
  redis_data:
  postgres_data:
  neo4j_data:
  neo4j_logs:

networks:
  archai_net:
    driver: bridge
